name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # 公開するファイル(public フォルダ)を準備してアップロードする
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      # アプリシェルの内容ハッシュ一覧を生成する(Service Worker の install が参照し、
      # 内容が変わっていないファイルの再取得を省く)
      - run: node scripts/gen-shell-revisions.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  # アップロードしたファイルを公開する
  # アップロードと同じジョブで続けて公開すると、アップロード直後でファイルが見つからず
  # 失敗することがあるため、ジョブを分けている(actions/deploy-pages の issue #451)
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
